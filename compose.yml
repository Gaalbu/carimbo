name: carimbo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carimbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carimbo}
      POSTGRES_DB: ${POSTGRES_DB:-carimbo}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Site e API em containers: docker compose --profile app up --build
  # O site usa a mesma NUXT_PUBLIC_API_BASE no SSR e no navegador, então o container web
  # compartilha a rede do container api: "127.0.0.1:<API_PORT>" vale para os dois lados
  # (127.0.0.1, não localhost: no Alpine, localhost resolve para ::1 e a API escuta em IPv4).
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3001}
      DATA_FILE: /app/data/reviews.json
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - '127.0.0.1:${API_PORT:-3001}:${API_PORT:-3001}'
      - '127.0.0.1:${WEB_PORT:-3000}:${WEB_PORT:-3000}'
    volumes:
      # Lê o data/reviews.json do repositório; a API relê o arquivo quando ele muda.
      - ./data:/app/data:ro
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      HOST: 0.0.0.0
      PORT: ${WEB_PORT:-3000}
      NUXT_PUBLIC_API_BASE: http://127.0.0.1:${API_PORT:-3001}
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
